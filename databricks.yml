# This is a Databricks asset bundle definition for ptcg_collection.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: ptcg_collection
  uuid: af113222-4248-4c11-a599-8cb8f493e2d0

include:
  # Explicitly include only the job definition; the DLT pipeline has been
  # removed as part of the poke.church migration (see MIGRATION_PLAN.md).
- resources/ptcg_collection.job.yml

variables:
  # Unity Catalog schema used by the bronze and silver notebooks.
  # Overridden to a dev-specific schema in the 'dev' target so that
  # development runs never overwrite production tables.
  target_schema:
    default: pokemon_tcg_collection

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-5bffcd4b-bc65.cloud.databricks.com
    variables:
      target_schema: pokemon_tcg_collection_dev

  prod:
    mode: production
    workspace:
      host: https://dbc-5bffcd4b-bc65.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/peter.nielsen22@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/peter.nielsen22@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: peter.nielsen22@gmail.com
        level: CAN_MANAGE
    variables:
      target_schema: pokemon_tcg_collection
