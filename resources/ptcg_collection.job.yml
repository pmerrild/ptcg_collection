# The main job for ptcg_collection.
resources:
  jobs:
    ptcg_collection_job:
      name: ptcg_collection_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      job_clusters:
        - job_cluster_key: main_cluster
          new_cluster:
            # Databricks Runtime 15.4 LTS matches the databricks-connect version used in dev.
            spark_version: 15.4.x-scala2.12
            node_type_id: r5.xlarge
            num_workers: 1

      parameters:
        - name: target_schema
          default: ${var.target_schema}

      tasks:
        - task_key: bronze_ingestion
          job_cluster_key: main_cluster
          notebook_task:
            # Fetches all sets and cards from the poke.church REST API and writes
            # them to workspace.<target_schema>.tcg_all_sets and
            # workspace.<target_schema>.tcg_all_cards (Delta).
            notebook_path: ../src/01 bronze_all_cards_API.ipynb
            base_parameters:
              target_schema: "{{job.parameters.target_schema}}"

        - task_key: silver_processing
          job_cluster_key: main_cluster
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            # Joins the ingested card/set data with the personal collection CSV
            # to produce an enriched view of the personal collection (currently SELECT-only; no table write).
            notebook_path: ../src/02 silver_own_collection.ipynb
            base_parameters:
              target_schema: "{{job.parameters.target_schema}}"
